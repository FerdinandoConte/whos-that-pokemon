<!doctype html>
<html lang="en" data-theme="arena">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#140C34">
<meta name="description" content="Guess the Pokémon from its silhouette. A fan game made for Daniele.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Who's That?">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Who's That Pokémon?</title>
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Bangers&amp;family=Barlow+Condensed:wght@600;800&amp;family=Bungee&amp;family=Fredoka:wght@500;600;700&amp;family=Lilita+One&amp;family=Luckiest+Guy&amp;family=Nunito:wght@600;800;900&amp;family=Patrick+Hand&amp;family=Quicksand:wght@600;700&amp;family=Titan+One&amp;family=VT323&amp;display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/themes/arena.css">
<link rel="stylesheet" href="css/themes/burst.css">
<link rel="stylesheet" href="css/themes/comic.css">
<link rel="stylesheet" href="css/themes/forest.css">
<link rel="stylesheet" href="css/themes/arcade.css">
<script>
  // apply the saved theme before first paint (no flash of the default theme)
  try { var t = localStorage.getItem('wtp.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<main id="app" aria-live="off"></main>
<div id="sheets"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<noscript><p class="fatal">This game needs JavaScript turned on.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
